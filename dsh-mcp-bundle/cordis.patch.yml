# Configuration-only bundle: no Host or Client entry files.
#
# Mounts the laya-mcp stdio server through the harness's own MCP client, so the
# harness owns the process lifecycle. That is the point of this row: the
# alternative is a sidecar the user keeps running themselves, and a background
# server started from a session is reaped with the session, which is exactly the
# wrong lifecycle for something meant to outlive it.
#
# `command` is the virtualenv's interpreter directly, NOT `npx laya-mcp` and not
# the `laya-mcp` console script. Two reasons, both measured:
#
#   * The MCP stdio transport spawns with `shell: false`. On Windows the npm
#     console-script shims are `.cmd` files, which cannot be executed that way —
#     `spawn("npx", {shell:false})` is ENOENT and `spawn("npx.cmd", ...)` is
#     EINVAL, while `spawn("cmd", ["/c", "npx", ...])` works. A real `.exe`
#     sidesteps the whole problem.
#   * The Node launcher has to go looking for an interpreter that can import
#     `laya_mcp`, and on a machine where `python` on PATH is the Microsoft Store
#     stub that search legitimately fails. Naming the interpreter here removes
#     the search entirely.
#
# `--model-root` matters more than it looks. Without it, `--model english` resolves
# through the Hub: the server reaches out to huggingface.co, and if the cache is
# cold it downloads ~800 MB and then re-verifies 38 files on every start. Measured
# here — a start with no model root pulled 1.1 GB into the HF cache while an
# identical checkpoint already sat on disk. With the root named, startup reads the
# local snapshot and makes no network call at all, which also means it works
# offline and behind a proxy.
#
# `--sidecar` IS set. That reverses an earlier decision, and the earlier reasoning
# was not wrong so much as outweighed — it said a session-spawned sidecar is reaped
# with its session, so hosting the model here was "the one that works after a
# reboot". What that cost, measured on this machine rather than argued:
#
#   * two checkpoints resident at once — this server's own copy and the sidecar the
#     sibling `laya` plugin expects — exhausted Windows' commit charge, and a
#     safetensors load died with OS error 1455 (ERROR_COMMITMENT_LIMIT);
#   * the `laya` row's tools were dead in every session that had no sidecar running,
#     because `lifecycle: never` starts nothing;
#   * seven tool schemas described one model.
#
# So the `laya` plugin row now spawns the sidecar and owns it, and this row is a
# thin stdio proxy to the same process: exactly one checkpoint is resident, and both
# surfaces work. `--filter` drops the two tools the plugin already provides —
# `laya_ask` and `laya_plan` belong to the plugin, which renders them with the
# harness's own presentation — leaving these three primitive conveniences, which it
# does not provide. Delete the `--filter` pair to expose all five here instead.
#
# The residual caveat, stated rather than buried: a sidecar the plugin started is
# stopped when that session unmounts, so a second session that had attached to it
# loses the tools until it restarts. A sidecar started outside any session — in its
# own terminal, or by a scheduled task — is never touched by any session, which
# removes the caveat entirely; while one is listening, `lifecycle: spawn` never
# fires. Nothing here starts one of those.
#
# The model options below are unused while a sidecar is configured and are kept
# anyway: a harness writes this command into a config file it never revisits, and
# dropping them would make the self-hosting fallback impossible to restore without
# editing this file. With the flag present but nothing listening, every call returns
# a structured `sidecar_unreachable` naming the fix — it does not hang, and it does
# not silently fall back to loading a model here.
- insert:
    - id: laya-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: laya
        transport: stdio
        command: 'D:\Projects\laya-family\.venv-laya\Scripts\python.exe'
        args:
          - '-m'
          - 'laya_mcp'
          - 'mcp'
          - '--sidecar'
          - 'http://127.0.0.1:8787'
          - '--filter'
          - 'noul,choice,score'
          - '--model-root'
          - 'D:\Projects\laya-family\_models\laya'
        failOnStartupError: false

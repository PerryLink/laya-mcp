# Publish to PyPI with no stored credential.
#
# There is no `secrets:` block in this file, and that is the entire point. GitHub
# mints a short-lived OIDC token for this job, PyPI verifies it against the
# Trusted Publisher configured for this repository, and the resulting upload
# credential exists for the duration of one job. Nothing long-lived is stored on
# a developer machine, in a repository secret, or in a password manager.
#
# The four values below must match the PyPI "pending publisher" form exactly,
# character for character - a mismatch is the single most common failure:
#
#   PyPI Project Name   laya-mcp
#   Owner               PerryLink
#   Repository name     laya-mcp
#   Workflow name       publish.yml      <- this filename
#   Environment name    pypi             <- the `environment:` key below
#
# `id-token: write` is what allows the OIDC exchange. Without it the job fails
# with a permissions error that does not mention publishing at all.

name: publish

on:
  release:
    types: [published]
  # Manual trigger, so a release can be re-published or a first publish can be
  # run without cutting a tag. Useful precisely once: on the first run PyPI
  # creates the project, which is what converts the pending publisher into a
  # normal one.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # Catches a long description that renders locally and 400s on upload,
      # before the publish step burns a version number on it. PyPI does not
      # allow a filename to be reused, so a failed upload of a given version is
      # permanent.
      - name: Validate
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `with: password:` - that is the point. The action detects the OIDC
        # environment and exchanges the GitHub token for a PyPI upload token.
